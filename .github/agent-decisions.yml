    decision_needed: 現在ファイルと必要に応じた履歴に含まれる Slack 内部情報を、どの範囲で除去または匿名化するか。
    current_status: Issue #56 を作成済み。公開前ブロッカーとして、実装前に人間判断が必要。現在ファイルのプレースホルダー化を推奨し、履歴書き換えや大量ログ削除は別判断に分離する方針。
    background: 公開前レビューで AGENTS.md、work-log、logs 配下に Slack workspace URL / ID / channel ID / 投稿リンクが含まれる可能性が指摘された。AGENTS.md で実 Slack URL / channel ID の存在を確認済み。リポジトリは public。
    options:
      - key: 1
        label: 現在ファイルをプレースホルダー化
        description: 現在ファイルの Slack URL / workspace ID / channel ID / 投稿リンクを公開用プレースホルダーへ置換し、履歴書き換えは別 Issue で判断する。
        reason: 公開前リスクを最小実装で下げられ、大量削除や履歴書き換えを分離できる。
        risk: 過去コミットには残る可能性があるため、必要なら別途履歴対応が必要。
        next_action: 対象文字列を検索し、現在ファイルをプレースホルダーへ置換する実装 Issue / PR に進める。
      - key: 2
        label: ログ保持方針を見直す
        description: docs/ai-development/logs と長大な work-log の公開リポジトリ保持方針を見直し、不要ログを削除または別管理に移す。
        reason: アプリ利用者に不要な運用ノイズを減らせる。
        risk: 大量削除になりやすく、運用証跡を失う可能性がある。
        next_action: 削除範囲を別 Issue で明確化し、人間承認後に実施する。
      - key: 3
        label: 履歴書き換えも検討
        description: 過去コミットに残る Slack 情報も含めて履歴書き換えを検討する。
        reason: 公開済み履歴からも識別子を除去したい場合に必要。
        risk: 破壊的で影響が大きく、ブランチやPRへの影響も出る。
        next_action: 人間承認付きの別 Issue / 手順へ分離する。
      - key: 4
        label: その他 / 自由記述
        description: 上記以外の扱いを指定する。
        reason: 公開方針や運用証跡要件に応じる。
        risk: 指定内容により異なる。
        next_action: 指定内容を progress、requirements、work-log、関連 Issue に反映する。
    ai_recommendation:
      option: 1
      reason: 現在ファイルから実 Slack 情報を消すのが最短の公開前リスク低減で、履歴書き換えや大量ログ削除は別の人間承認に分けられるため。
